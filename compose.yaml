services:
  moodle:
    image: elturingg/moodle:5.3-php8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    volumes:
      - moodle_code:/var/www/html
      - /srv/data/moodledata:/var/www/moodledata
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.28
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - moodle_code:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - moodle
    networks:
      - backend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: ${MOODLE_DB_PASSWORD:?Set MOODLE_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Jakarta
    volumes:
      - /srv/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - backend

volumes:
  moodle_code:

networks:
  backend:
    driver: bridge
